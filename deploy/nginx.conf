# Example nginx site for Promotional Content Hub (TLS terminates here; app listens on 127.0.0.1:3000)
# Goes in the http context (a file in sites-enabled/ or conf.d/ is already included there).
# --- Real client address ---------------------------------------------------------------------------------------------------------
# The audit log, the sign-in limits and the per-address lock all use the address nginx reports. If users reach nginx through ANOTHER
# gateway (firewall, load balancer, CDN, Windows/Apache reverse proxy...), $remote_addr is that gateway's address for everybody, and the
# audit log shows the gateway for every line. Tell nginx which gateways to trust and which header carries the real client:
#   1. the gateway must add the client address to X-Forwarded-For (or send the PROXY protocol); a plain NAT hides it for good
#   2. uncomment and adjust the next three lines (the address(es) of the gateway as nginx sees it)
#set_real_ip_from 10.0.0.5;            # the gateway; repeat the line for more of them, or use a range such as 10.0.0.0/24
#real_ip_header   X-Forwarded-For;     # or: proxy_protocol (and add "proxy_protocol" to the listen lines)
#real_ip_recursive on;
# With these set, $remote_addr below is the real client, and the app gets it through X-Forwarded-For (keep TRUST_PROXY=1 in .env).
limit_req_zone $binary_remote_addr zone=hub_login:10m rate=10r/m;

server {
  listen 80;
  server_name hub.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name hub.example.com;

  ssl_certificate     /etc/letsencrypt/live/hub.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/hub.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 26m;    # Knowledge Base PDFs are capped at 25 MB by the app (KNOWLEDGE_MAX_MB); logos at 2 MB
  server_tokens off;

  # Restore analysis uploads: whole backup archives, so a larger body limit and a longer read timeout (match BACKUP_MAX_MB)
  location = /api/admin/backups/analyze {
    client_max_body_size 20g;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  # Sign-in and 2FA: slow password guessing before it reaches the app (the app also locks accounts and limits per address)
  location ~ ^/api/auth/(login|2fa)$ {
    limit_req zone=hub_login burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;                 # replaces anything the client sent; app needs TRUST_PROXY=1
    proxy_set_header X-Forwarded-Proto $scheme;                      # required for Secure cookies
    proxy_read_timeout 60s;
  }
}
