<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/theme-boot.js"></script>
<title>Sign in · Promotional Content Hub</title>
</head>
<body>
<div class="auth-wrap">
  <div class="card auth-card">
    <div class="brand" id="brand"><span class="mark">P</span><span class="name">Promotional Content Hub</span></div>
    <div class="alert err hidden mb-12" id="err"></div>
    <form id="login-form" class="stack" autocomplete="on">
      <label class="f"><span>Username</span><input name="username" autocomplete="username" required autofocus maxlength="60"></label>
      <label class="f"><span>Password</span><input name="password" type="password" autocomplete="current-password" required maxlength="128"></label>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
    <form id="otp-form" class="stack hidden" autocomplete="off">
      <p class="muted m-0">Enter the 6-digit code from your authenticator app.</p>
      <input name="token" class="otp-input" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
      <button class="btn primary" type="submit">Verify</button>
      <button class="btn ghost" type="button" id="otp-back">Back</button>
    </form>
  </div>
</div>
<script src="/js/common.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
