# Set POSTGRES_PASSWORD in .env (and use the same password in DATABASE_URL below via ${POSTGRES_PASSWORD}).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: promohub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: promohub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promohub"]
      interval: 5s
      retries: 10
    # no ports: Postgres is only reachable from the app container

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://promohub:${POSTGRES_PASSWORD}@db:5432/promohub
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"   # only the local reverse proxy can reach the app
    volumes:
      - branding:/app/uploads/branding

volumes:
  pgdata:
  branding:
